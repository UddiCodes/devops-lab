name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install Dependencies
          run: pip install -r requirements.txt

        - name: Lint with flake8
          run: flake8 app.py calculator.py test_calculator.py --max-line-length=100
        
        - name: Run tests with pytest
          run: pytest-v
      